<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatBox – Canje en proceso</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-error pagina-procesando">

  <header>
    <a class="logo" href="index.html">
      <img src="logo.png" alt="Logo de CatBox">
      <span class="logo-texto">
        <span class="logo-nombre">catbox</span>
        <span class="logo-slogan">como una BigBox, pero mucho peor</span>
      </span>
    </a>
  </header>

  <main>
    <img class="error-imagen" src="gato-dormido.jpg" alt="Un gato durmiendo sobre una notebook">
    <p class="opcion-categoria" id="experiencia"></p>
    <h1>Tu canje está siendo procesado</h1>
    <p class="subtitulo">Aún no tenemos la confirmación, pero estamos trabajando para resolverlo.</p>
    <p class="aviso">Ante cualquier duda, ponete en contacto con <strong>soporte@catbox.com</strong></p>
  </main>

  <footer>
    Regalar CatBox es regalar momentos olvidables.<br>
    © CatBox 2026
  </footer>

  <script src="experiencias.js"></script>
  <script>
    const op = OPCIONES[Number(new URLSearchParams(location.search).get("id"))];
    if (op) document.getElementById("experiencia").textContent = op.titulo;
  </script>
</body>
</html>
