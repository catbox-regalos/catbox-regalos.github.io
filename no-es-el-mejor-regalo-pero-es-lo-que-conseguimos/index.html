<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatBox – Te regalaron un CatBox</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

  <header>
    <a class="logo" href="index.html">
      <img src="logo.png" alt="Logo de CatBox">
      <span class="logo-texto">
        <span class="logo-nombre">catbox</span>
        <span class="logo-slogan">como una BigBox, pero mucho peor</span>
      </span>
    </a>
    <span class="header-link">🎁 Abrir regalo</span>
  </header>

  <main>
    <h1>Barbi, ¡tus amigos te hicieron un regalo! 🎁</h1>
    <p class="subtitulo">Ingresá el código secreto para canjearlo.</p>

    <form id="formulario" novalidate>
      <input class="campo-codigo" id="codigo" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Código secreto" placeholder="Código secreto">
      <p class="mensaje-error" id="error" role="alert"></p>

      <button type="submit" class="boton" id="activar" disabled>Activar mi código</button>
    </form>
  </main>

  <footer>
    Regalar CatBox es regalar momentos olvidables.<br>
    © CatBox 2026
  </footer>

  <script>
    // ⬇️ RESPUESTAS CORRECTAS (no importan mayúsculas, tildes ni espacios de más)
    const RESPUESTAS = ["Juan", "Juan Martín", "Pili", "Pilar", "Santi", "Santiago", "Todos", "Ninguno"];

    const normalizar = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                             .toLowerCase().trim().replace(/\s+/g, " ");
    const validas = RESPUESTAS.map(normalizar);

    const campo = document.getElementById("codigo");
    const boton = document.getElementById("activar");
    const error = document.getElementById("error");

    campo.addEventListener("input", () => {
      boton.disabled = campo.value.trim() === "";
      error.textContent = "";
      campo.classList.remove("error");
    });

    document.getElementById("formulario").addEventListener("submit", e => {
      e.preventDefault();
      if (validas.includes(normalizar(campo.value))) {
        try { sessionStorage.setItem("catbox-ok", "1"); } catch (err) {}
        window.location.href = "canje.html";
      } else {
        error.textContent = "Código incorrecto. Probá de nuevo.";
        campo.classList.remove("error");
        void campo.offsetWidth; // reinicia la animación
        campo.classList.add("error");
      }
    });

    campo.focus();
  </script>
</body>
</html>
