<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatBox – Error 404</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body class="pagina-error">

  <header>
    <a class="logo" href="index.html">
      <img src="logo.png" alt="Logo de CatBox">
      <span class="logo-texto">
        <span class="logo-nombre">catbox</span>
        <span class="logo-slogan">como una BigBox, pero mucho peor</span>
      </span>
    </a>
  </header>

  <main>
    <img class="error-imagen" src="gato-enchufe.jpg" alt="Un gato desenchufando un cable">
    <h1>Error 404</h1>
    <p class="subtitulo">En este momento no se puede canjear esta experiencia.</p>
    <button class="boton" id="volver">← Volver atrás</button>
  </main>

  <footer>
    Regalar CatBox es regalar momentos olvidables.<br>
    © CatBox 2026
  </footer>

  <script>
    document.getElementById("volver").addEventListener("click", () => {
      if (history.length > 1) history.back();
      else window.location.href = "canje.html";
    });
  </script>
</body>
</html>
